services:
  # ── Base de datos ──
  postgres:
    image: postgres:16
    container_name: chatbot-postgres
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # healthcheck permite que otros servicios esperen a que postgres
    # esté realmente listo antes de arrancar — no solo que el contenedor exista
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama (LLM local) ──
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persiste los modelos descargados entre reinicios del contenedor
      # Sin esto, habría que re-descargar el modelo cada vez
      - ollama_data:/root/.ollama
    # Arranca el servidor de Ollama
    command: serve
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot ──
  app:
    # build indica que Docker debe construir la imagen desde el Dockerfile
    # en lugar de descargarla — el punto es la ruta del Dockerfile (raíz)
    build: .
    container_name: chatbot-app
    ports:
      - "8081:8081"
    environment:
      # Sobrescribimos las propiedades de application.yml para el entorno Docker
      # En Docker, los servicios se comunican por nombre de contenedor, no localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chatbot_db
      SPRING_DATASOURCE_USERNAME: chatbot_user
      SPRING_DATASOURCE_PASSWORD: chatbot_pass
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data: